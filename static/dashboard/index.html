<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAM Dashboard</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-diagram-3"></i> IPAM Dashboard
            </span>
            <div class="d-flex align-items-center gap-3 text-light">
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" id="auto-refresh-toggle">
                    <label class="form-check-label small" for="auto-refresh-toggle">
                        Auto-actualizar (30s)
                    </label>
                </div>
                <small id="last-updated" class="text-secondary">Última actualización: --</small>
                <button id="refresh-btn" class="btn btn-outline-light btn-sm" type="button">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">

        <!-- Estado de conexión con la API (heredado del Paso 1) -->
        <div id="status" class="alert alert-secondary py-2 px-3 small">
            Verificando conexión con la API...
        </div>

        <!-- Barra de filtros -->
        <div class="card mb-3">
            <div class="card-body d-flex flex-wrap align-items-center gap-3">
                <div>
                    <label for="filter-subnet" class="form-label small mb-1">Subred</label>
                    <select id="filter-subnet" class="form-select form-select-sm">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div>
                    <label for="filter-status" class="form-label small mb-1">Estado</label>
                    <select id="filter-status" class="form-select form-select-sm">
                        <option value="">Todos</option>
                        <option value="FREE">Libre</option>
                        <option value="ASSIGNED">Asignada</option>
                        <option value="ACTIVE">Activa sin registrar</option>
                    </select>
                </div>
                <button id="clear-filters-btn" class="btn btn-link btn-sm ms-auto" type="button">
                    Limpiar filtros
                </button>
            </div>
        </div>

        <!-- Leyenda de colores -->
        <div class="card mb-4">
            <div class="card-body d-flex flex-wrap gap-4">
                <div class="legend-item">
                    <span class="legend-swatch ip-free"></span>
                    <span>Libre (FREE)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-swatch ip-assigned"></span>
                    <span>Asignada (ASSIGNED)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-swatch ip-active"></span>
                    <span>Activa sin registrar (ACTIVE)</span>
                </div>
            </div>
        </div>

        <!-- Contenedor del grid: cada subred se renderiza aquí como un bloque -->
        <div id="ips-grid-container">
            <div class="text-center text-muted py-5">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                El grid de IPs se construye en el Paso 3.
            </div>
        </div>

    </div>

    <!-- Modal de detalle de IP (reemplaza el alert() del Paso 3) -->
    <div class="modal fade" id="ipDetailModal" tabindex="-1" aria-labelledby="ipDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ipDetailModalLabel">Detalle de IP</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <dl class="row mb-0">
                        <dt class="col-4">Dirección IP</dt>
                        <dd class="col-8" id="modal-ip">--</dd>

                        <dt class="col-4">Estado</dt>
                        <dd class="col-8"><span id="modal-status-badge" class="badge">--</span></dd>

                        <dt class="col-4">Subred</dt>
                        <dd class="col-8" id="modal-subnet">--</dd>

                        <dt class="col-4">Cliente</dt>
                        <dd class="col-8" id="modal-client">--</dd>

                        <dt class="col-4">Descripción</dt>
                        <dd class="col-8" id="modal-description">--</dd>
                    </dl>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
