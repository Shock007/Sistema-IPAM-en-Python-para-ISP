<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPAM Dashboard</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-diagram-3"></i> IPAM Dashboard
            </span>
            <div class="d-flex align-items-center gap-3 text-light">
                <small id="last-updated" class="text-secondary">Última actualización: --</small>
                <button id="refresh-btn" class="btn btn-outline-light btn-sm" type="button">
                    <i class="bi bi-arrow-clockwise"></i> Actualizar
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">

        <!-- Estado de conexión con la API (heredado del Paso 1) -->
        <div id="status" class="alert alert-secondary py-2 px-3 small">
            Verificando conexión con la API...
        </div>

        <!-- Barra de filtros (placeholder; se activa en el Paso 5) -->
        <div class="card mb-3">
            <div class="card-body d-flex flex-wrap align-items-center gap-3">
                <div>
                    <label for="filter-subnet" class="form-label small mb-1">Subred</label>
                    <select id="filter-subnet" class="form-select form-select-sm" disabled>
                        <option>Todas</option>
                    </select>
                </div>
                <div>
                    <label for="filter-status" class="form-label small mb-1">Estado</label>
                    <select id="filter-status" class="form-select form-select-sm" disabled>
                        <option>Todos</option>
                    </select>
                </div>
                <span class="text-muted small ms-auto">Filtros disponibles en el Paso 5</span>
            </div>
        </div>

        <!-- Leyenda de colores -->
        <div class="card mb-4">
            <div class="card-body d-flex flex-wrap gap-4">
                <div class="legend-item">
                    <span class="legend-swatch ip-free"></span>
                    <span>Libre (FREE)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-swatch ip-assigned"></span>
                    <span>Asignada (ASSIGNED)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-swatch ip-active"></span>
                    <span>Activa sin registrar (ACTIVE)</span>
                </div>
            </div>
        </div>

        <!-- Contenedor del grid: cada subred se renderiza aquí como un bloque -->
        <div id="ips-grid-container">
            <div class="text-center text-muted py-5">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                El grid de IPs se construye en el Paso 3.
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
